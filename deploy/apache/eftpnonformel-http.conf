# eftpnonformel.ins.ne — port 80 : validation Let's Encrypt, puis redirection permanente vers HTTPS.
# Installé dans /etc/apache2/sites-available/ par deploy/scripts/install-server.sh.
<VirtualHost *:80>
    ServerName eftpnonformel.ins.ne

    # Défi ACME (certbot --webroot) servi depuis un dossier dédié, hors de l'application.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://eftpnonformel.ins.ne%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/eftpnonformel-error.log
    CustomLog ${APACHE_LOG_DIR}/eftpnonformel-access.log combined
</VirtualHost>
