# eftpnonformel.ins.ne — HTTPS. Racine web = backend/public de la version courante (lien « current »).
#   https://eftpnonformel.ins.ne/            → back-office (redirigé vers /app/)
#   https://eftpnonformel.ins.ne/api/v1/...  → API (web + tablettes)
# Les règles de réécriture et les en-têtes de sécurité (CSP, HSTS…) sont dans backend/public/.htaccess et
# backend/public/app/.htaccess : AllowOverride All est donc nécessaire.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName eftpnonformel.ins.ne
    DocumentRoot /var/www/eftpnonformel/current/backend/public

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/eftpnonformel.ins.ne/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/eftpnonformel.ins.ne/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # Le chemin <Directory> couvre releases/ ET current/ (Apache compare le chemin non résolu).
    <Directory /var/www/eftpnonformel>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # Transmet l'en-tête Authorization (jeton Bearer des tablettes) à PHP-FPM.
        CGIPassAuth On
    </Directory>

    # PHP-FPM : pool dédié (deploy/php/eftp-fpm-pool.conf).
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-eftp.sock|fcgi://localhost"
    </FilesMatch>
    <Proxy "fcgi://localhost">
        ProxySet timeout=300
    </Proxy>

    # Publication de l'APK (≤ 300 Mo) depuis le back-office ; soumissions mobiles ≤ 1 Mo.
    LimitRequestBody 330000000
    Timeout 300

    # Fichiers cachés (.htaccess, .git…) jamais servis.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Compression des réponses JSON / JS / CSS (les tablettes passent souvent par la 3G).
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json text/html text/css application/javascript text/javascript image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/eftpnonformel-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/eftpnonformel-ssl-access.log combined
</VirtualHost>
</IfModule>
