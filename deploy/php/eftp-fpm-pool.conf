; Pool PHP-FPM dédié à la plateforme EFTP non formel.
; Installé dans /etc/php/8.3/fpm/pool.d/eftp.conf par install-server.sh.
[eftp]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-eftp.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ≈ 60 Mo par processus : 20 processus tiennent dans ~1,2 Go. À ajuster selon la RAM du VPS.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 300

php_admin_value[error_log] = /var/log/php8.3-fpm-eftp.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 310M
php_admin_value[post_max_size] = 315M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[date.timezone] = Africa/Niamey

; Le code ne lit que le projet et les fichiers temporaires d'envoi.
php_admin_value[open_basedir] = /var/www/eftpnonformel/:/tmp/:/usr/share/php/
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[session.cookie_secure] = 1
