; Réglages PHP communs (FPM et CLI) — /etc/php/8.3/{fpm,cli}/conf.d/99-eftp.ini
date.timezone = Africa/Niamey
expose_php = Off
display_errors = Off
log_errors = On

; OPcache : le code ne change qu'au déploiement (deploy-release.sh recharge PHP-FPM).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
